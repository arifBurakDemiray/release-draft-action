name: Form a Draft Release on Staging Merge

permissions:
  contents: write

on:
  push:
    branches:
      - staging

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract changelog content
        id: changelog
        run: |
          # Get the FIRST heading in the file
          first_heading=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //')

          echo "First heading: $first_heading"

          # Check if the first heading is a semantic version X.Y.Z
          if [[ ! $first_heading =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "First heading is NOT a semantic version. Exiting without doing anything."
            echo "version=" >> $GITHUB_OUTPUT
            exit 0
          fi

          version=$first_heading
          echo "Semantic version found: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

          # Extract its body
          awk -v ver="## $version" '
            $0 == ver {flag=1; next}
            /^## / && flag {exit}
            flag {print}
          ' CHANGELOG.md > body.txt

          # Trim trailing empties
          perl -0777 -pe "s/\n+\$//" body.txt > tmp && mv tmp body.txt

          echo "Extracted changelog body:"
          cat body.txt


      - name: Create or update release
        if: ${{ steps.changelog.outputs.version != '' }}
        run: |
          version=${{ steps.changelog.outputs.version }}

          echo "Processing release for version: $version"

          # Check if release already exists
          exists=$(gh release list --json tagName | jq -r --arg version "$version" '.[] | select(.tagName == $version) | .tagName')

          if [ -z "$exists" ]; then
            echo "Release does NOT exist. Creating (draft)..."
            gh release create "$version" \
              --target staging \
              --draft \
              --title "$version" \
              --notes-file body.txt
          else
            echo "Release exists. Updating notes..."
            gh release edit "$version" \
              --notes-file body.txt
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: |
          version=${{ steps.changelog.outputs.version }}
          echo "Publishing release: $version"
          gh release edit "$version" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
